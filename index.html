<!DOCTYPE html>
<html>
<head>
<title>Spice Aura | Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  height:100%;
  width:100%;
  font-family:'Montserrat', sans-serif;
  background-color:#000;
}

body{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  color:white;
  background-image:url('cover.jpg');
  background-position:center bottom;
  background-repeat:no-repeat;
  background-size:contain; /* Important: no cutting */
}

/* Dark fade at bottom for elegance */
body::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:40%;
  background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
}

.content{
  position:relative;
  text-align:center;
  margin-bottom:60px;
  z-index:2;
}

.launch{
  font-family:'Playfair Display', serif;
  font-size:28px;
  letter-spacing:6px;
  margin-bottom:20px;
}

.contact{
  font-size:14px;
  line-height:2;
  opacity:0.9;
}

@media(max-width:768px){
  .launch{
    font-size:20px;
    letter-spacing:3px;
  }
}
</style>
</head>

<body>

<div class="content">
  <div class="launch">WEBSITE LAUNCHING SOON</div>
  <div class="contact">
    info@spiceaurafoods.com<br>
    +1 289 952 6201<br>
    www.spiceaurafoods.com
  </div>
</div>

</body>
</html>
